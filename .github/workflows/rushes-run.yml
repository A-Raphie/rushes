name: rushes-run

# The public run engine: a dispatch from the site executes a recorded task
# on Solari and commits the receipt (tape + manifest + registry) to the
# repo. The receipt commit IS the product's persistence layer.

on:
  repository_dispatch:
    types: [run-request]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install engine
        run: npm install --prefix engine

      - name: Write task spec
        env:
          SPEC: ${{ toJSON(github.event.client_payload.spec) }}
        run: |
          node -e "require('fs').writeFileSync('engine/specs/web-run.json', process.env.SPEC)"

      - name: Run the recorded engine
        working-directory: engine
        env:
          SOLARI_API_KEY: ${{ secrets.SOLARI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx run.ts specs/web-run.json
